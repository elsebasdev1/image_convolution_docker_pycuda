[project]
name = "convolucion-gpu-web"
version = "1.0.0"
description = "Servicio web de convolución de imágenes con kernels CUDA propios (PyCUDA) en Docker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165.0",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pycuda>=2026.1",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requiere una GPU NVIDIA real"]
